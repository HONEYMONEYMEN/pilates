<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#14101C">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Пилатес">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<title>Пилатес · Мой кабинет</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Comfortaa:wght@600;700&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* «Пружины реформера»: статусы окрашены как пружины пилатес-реформера */
:root{
  --bg:#F2F1F6;--surface:#FFFFFF;--surface2:#F7F6FA;--ink:#1E1A2B;--ink2:#5E5873;--mute:#8E89A0;--line:#E7E4EF;
  --night:#22182F;--night2:#33264A;--nightInk:#F4F0FA;--nightMute:#A99DBE;
  --go:#14A367;--go-l:#E1F5EB;
  --stop:#E5484D;--stop-l:#FDE9E9;
  --plan:#3E7BFA;--plan-l:#E6EEFF;
  --sun:#FFC83D;--sun-d:#A97A00;--sun-l:#FFF3D1;
  --off:#8F8AA0;--off-l:#EEEDF3;
  --violet:#6E4FF0;--violet-l:#EEE9FF;
  --shadow:0 1px 2px rgba(30,26,43,.04),0 10px 30px rgba(30,26,43,.06);
  --btn:#22182F;--btnInk:#fff;
  --font:Onest,system-ui,-apple-system,sans-serif;--disp:Unbounded,Onest,sans-serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font);font-size:16px;line-height:1.4;-webkit-font-smoothing:antialiased}
#app{max-width:640px;margin:0 auto;padding:0 16px 132px}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;padding:0}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--violet);outline-offset:2px}
input,textarea,select{font:inherit;font-size:16px;width:100%;padding:14px 15px;border:1.5px solid var(--line);border-radius:14px;background:var(--surface);color:var(--ink);outline:none;-webkit-appearance:none;appearance:none}
input:focus,textarea:focus,select:focus{border-color:var(--violet);box-shadow:0 0 0 4px var(--violet-l)}
textarea{min-height:84px;resize:vertical}
.disp{font-family:var(--disp);letter-spacing:-.02em}
h1{font-family:var(--disp);font-size:26px;font-weight:600;margin:0;letter-spacing:-.025em;line-height:1.15}
h2{font-family:var(--disp);font-size:21px;font-weight:600;margin:0;letter-spacing:-.02em}
h3{font-size:17px;font-weight:700;margin:26px 2px 10px}
.mute{color:var(--mute)}.small{font-size:13px}
.mt8{margin-top:8px}.mt16{margin-top:16px}
.row{display:flex;align-items:center;gap:10px}.between{justify-content:space-between}.grow{flex:1;min-width:0}
.ic{display:inline-block;vertical-align:-4px;flex:none;stroke-width:var(--icw,2);fill:var(--icfill,none);fill-opacity:var(--icfo,1)}
.btnic{display:inline-flex;align-items:center;justify-content:center;gap:8px}

/* верхняя тёмная панель — главное каждого экрана */
.hero{background:var(--night);color:var(--nightInk);margin:0 -16px 18px;padding:calc(14px + env(safe-area-inset-top)) 18px 22px;border-radius:0 0 30px 30px;position:relative;overflow:hidden}
.hero::after{content:"";position:absolute;right:-80px;top:-90px;width:260px;height:260px;border-radius:50%;background:radial-gradient(circle,rgba(110,79,240,.35),transparent 70%);pointer-events:none}
.hero>*{position:relative;z-index:1}
@media(min-width:672px){.hero{margin:16px 0 18px;border-radius:30px}}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:18px}
.logo{display:flex;align-items:center;gap:10px}
.logo img{width:38px;height:38px;border-radius:11px;display:block}
.logo b{font-size:16px;font-weight:700;display:block}
.logo span{font-size:12.5px;color:var(--nightMute)}
.pill{background:rgba(255,255,255,.08);border-radius:999px;padding:9px 14px;font-weight:700;font-size:14px;color:var(--sun);white-space:nowrap}
.pill small{color:var(--nightMute);font-weight:500;margin-right:5px}

.week{display:flex;align-items:center;gap:4px}
.week .arr{width:30px;height:58px;border-radius:12px;color:var(--nightMute);display:grid;place-items:center;flex:none}
.days{display:grid;grid-template-columns:repeat(7,1fr);gap:5px;flex:1}
.dayb{background:rgba(255,255,255,.06);border-radius:15px;padding:8px 0 7px;text-align:center;position:relative;color:var(--nightInk)}
.dayb .w{font-size:12px;color:var(--nightMute);font-weight:500}
.dayb .n{font-family:var(--disp);font-size:16px;font-weight:600;margin-top:1px}
.dayb .c{display:block;width:5px;height:5px;border-radius:50%;background:var(--sun);margin:4px auto 0}
.dayb .c.none{background:transparent}
.dayb.today{box-shadow:inset 0 0 0 1.5px rgba(255,200,61,.55)}
.dayb.on{background:var(--sun);color:#22182F}
.dayb.on .w{color:rgba(34,24,47,.65)}
.dayb.on .c{background:#22182F}
.dayhead{display:flex;align-items:flex-end;justify-content:space-between;margin-top:20px;gap:12px}
.dayhead h1{font-size:30px}
.dayhead .d{color:var(--nightMute);font-size:15px;margin-top:4px}
.linkb{color:var(--sun);font-weight:600;font-size:14px;padding:6px 0;white-space:nowrap}
.springs{display:flex;gap:4px;height:9px;margin-top:18px}
.springs i{flex:1;border-radius:6px;background:rgba(255,255,255,.13)}
.springs i.came{background:var(--go)}.springs i.noshow{background:var(--stop)}.springs i.cancel{background:rgba(255,255,255,.32)}
.springcap{display:flex;justify-content:space-between;margin-top:9px;font-size:13.5px;color:var(--nightMute)}
.springcap b{color:var(--sun);font-weight:700}

/* карточки */
.card{background:var(--surface);border-radius:22px;padding:16px;box-shadow:var(--shadow)}
.card+.card{margin-top:12px}
.slot{background:var(--surface);border-radius:22px;margin-bottom:14px;overflow:hidden;box-shadow:var(--shadow)}
.slothead{display:flex;align-items:center;justify-content:space-between;padding:14px 16px 4px}
.slothead .t{font-family:var(--disp);font-size:20px;font-weight:600;letter-spacing:-.02em}
.tag{display:inline-flex;align-items:center;gap:5px;font-size:12.5px;font-weight:600;padding:5px 10px;border-radius:999px}
.tag.ind{background:var(--violet-l);color:var(--violet)}
.tag.grp{background:var(--plan-l);color:var(--plan)}
.vrow{padding:12px 16px 16px;border-top:1px solid var(--line)}
.slothead+.vrow{border-top:0}
.vtap{display:flex;align-items:center;gap:10px;width:100%;text-align:left}
.vtap .chev{color:var(--mute);opacity:.6}
.vname{font-weight:700;font-size:17px}
.vsub{font-size:13.5px;color:var(--mute);margin-top:2px;display:flex;align-items:center;gap:5px}
.vsub.warn{color:var(--stop);font-weight:600}
.vnote{display:flex;gap:7px;align-items:flex-start;font-size:13.5px;color:var(--ink2);background:var(--surface2);border-radius:12px;padding:9px 11px;margin-top:10px;white-space:pre-wrap;text-align:left}
.vnote .ic{margin-top:1px;color:var(--mute)}
.btns3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-top:12px}
.sb{border-radius:16px;padding:12px 4px 10px;font-weight:700;font-size:14px;line-height:1.15;display:flex;flex-direction:column;align-items:center;gap:4px;transition:transform .12s}
.sb small{font-weight:500;font-size:11px;opacity:.8;text-align:center}
.sb.came{background:var(--go-l);color:var(--go)}
.sb.noshow{background:var(--stop-l);color:var(--stop)}
.sb.cancel{background:var(--off-l);color:var(--ink2)}
.sb:active{transform:scale(.96)}
.done,.future{display:flex;align-items:center;justify-content:space-between;margin-top:12px;gap:10px}
.st{display:inline-flex;align-items:center;gap:6px;font-weight:700;font-size:14px;padding:8px 12px;border-radius:12px}
.st.came{background:var(--go-l);color:var(--go)}
.st.noshow{background:var(--stop-l);color:var(--stop)}
.st.cancel{background:var(--off-l);color:var(--ink2)}
.st.booked{background:var(--plan-l);color:var(--plan)}
.mini{font-size:14px;font-weight:600;color:var(--mute);padding:8px 4px}
.addto{display:flex;align-items:center;justify-content:center;gap:6px;width:100%;padding:13px;border-top:1px dashed var(--line);color:var(--violet);font-weight:600;font-size:14px}
.daytotal{display:flex;justify-content:space-between;align-items:center;padding:16px 18px;background:var(--sun-l);border-radius:20px;font-weight:600;color:var(--sun-d)}
.daytotal b{font-family:var(--disp);font-size:19px;color:var(--ink)}

.empty{text-align:center;padding:30px 18px;color:var(--mute)}
.empty .big{display:grid;place-items:center;width:64px;height:64px;border-radius:22px;background:var(--violet-l);color:var(--violet);margin:0 auto 14px}
.empty b{color:var(--ink);display:block;font-size:17px;margin-bottom:4px}

.attn{background:var(--surface);border-radius:22px;padding:14px 16px 6px;margin-bottom:16px;box-shadow:var(--shadow);border-left:4px solid var(--sun)}
.attn .h{font-weight:700;margin-bottom:4px;display:flex;align-items:center;gap:7px;color:var(--sun-d)}
.attn button{display:flex;width:100%;justify-content:space-between;align-items:center;padding:10px 0;border-top:1px solid var(--line);font-size:15px;text-align:left;gap:8px}
.attn button:first-of-type{border-top:0}
.attn button span:last-child{font-size:13.5px;color:var(--mute);text-align:right}

/* кнопки */
.primary{background:var(--btn);color:var(--btnInk);font-weight:700;border-radius:16px;padding:16px;width:100%;font-size:17px}
.primary:disabled{opacity:.45}
.secondary{background:var(--violet-l);color:var(--violet);font-weight:700;border-radius:16px;padding:14px;width:100%;font-size:16px}
.ghost{color:var(--ink2);font-weight:600;padding:13px;width:100%;border-radius:16px;border:1.5px solid var(--line);margin-top:8px}
.danger{color:var(--stop);font-weight:700;padding:13px;width:100%;border-radius:16px;background:var(--stop-l)}
.acts{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:0 0 4px}
.acts button{background:var(--surface);border-radius:20px;padding:16px 10px;font-weight:700;display:flex;flex-direction:column;align-items:center;gap:8px;box-shadow:var(--shadow)}
.acts button .ic{color:var(--violet)}

/* док-навигация */
#tabs{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(12px + env(safe-area-inset-bottom));background:var(--night);border-radius:26px;display:flex;align-items:center;gap:2px;padding:6px;z-index:6;box-shadow:0 12px 34px rgba(34,24,47,.35)}
#tabs button{width:76px;display:flex;flex-direction:column;align-items:center;gap:2px;padding:7px 0 6px;border-radius:20px;font-size:11.5px;font-weight:600;color:var(--nightMute)}
#tabs button.on{color:#fff;background:var(--night2)}
#tabs .plus{width:54px;height:54px;border-radius:19px;background:var(--sun);color:#22182F;display:grid;place-items:center;margin:0 4px;padding:0}
#tabs .plus:active{transform:scale(.95)}

/* клиенты */
.hero input{background:rgba(255,255,255,.08);border-color:transparent;color:var(--nightInk)}
.hero input::placeholder{color:var(--nightMute)}
.hero input:focus{border-color:var(--violet);box-shadow:none}
.seg2{display:flex;background:rgba(255,255,255,.07);border-radius:14px;padding:4px;margin:14px 0 10px}
.seg2 button{flex:1;padding:9px;border-radius:11px;font-weight:600;font-size:14px;color:var(--nightMute)}
.seg2 button.on{background:rgba(255,255,255,.14);color:#fff}
.panel .seg2{background:var(--off-l)}
.panel .seg2 button{color:var(--mute)}
.panel .seg2 button.on{background:var(--surface);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.06)}
.crow{display:flex;align-items:center;gap:12px;width:100%;text-align:left;padding:12px 2px;border-top:1px solid var(--line)}
.crow:first-child{border-top:0}
.ava{width:44px;height:44px;border-radius:15px;background:var(--violet-l);color:var(--violet);display:grid;place-items:center;font-family:var(--disp);font-weight:600;font-size:17px;flex:none}
.badge{font-weight:700;font-size:12.5px;padding:6px 10px;border-radius:999px;white-space:nowrap}
.badge.ok{background:var(--go-l);color:var(--go)}
.badge.low{background:var(--sun-l);color:var(--sun-d)}
.badge.zero{background:var(--stop-l);color:var(--stop)}
.badge.none{background:var(--off-l);color:var(--mute)}
.hero .badge.none{background:rgba(255,255,255,.1);color:var(--nightMute)}

/* карточка клиента */
.back{font-weight:600;color:var(--nightMute);padding:4px 0;margin-bottom:12px;font-size:15px}
.chead{display:flex;gap:14px;align-items:center}
.chead .ava{width:60px;height:60px;font-size:24px;border-radius:20px;background:rgba(255,255,255,.1);color:var(--sun)}
.chead h1{color:var(--nightInk)}
.info{display:grid;gap:12px}
.info .k{font-size:13px;color:var(--mute);font-weight:600}
.info .v{font-size:15.5px;white-space:pre-wrap}
.warnbox{background:rgba(229,72,77,.16);color:#FFB4B6;border-radius:16px;padding:12px 14px;font-size:15px;margin-top:16px}
.warnbox b{display:flex;align-items:center;gap:6px;font-size:13px;margin-bottom:3px;color:#FF8A8E}
.pkg{padding:14px 0;border-top:1px solid var(--line)}
.pkg:first-child{border-top:0;padding-top:2px}
.bar{height:9px;background:var(--off-l);border-radius:6px;overflow:hidden;margin:10px 0 7px}
.bar i{display:block;height:100%;background:var(--go);border-radius:6px}
.bar.low i{background:var(--sun)}.bar.zero i{background:var(--stop)}
.hrow{display:flex;justify-content:space-between;align-items:center;padding:11px 0;border-top:1px solid var(--line);font-size:15px;gap:10px}
.hrow:first-child{border-top:0}
.hrow.tap{width:100%;text-align:left;display:block}
.hrow.tap .top2{display:flex;justify-content:space-between;align-items:center;gap:10px}
.x{color:var(--mute);padding:4px 6px}

/* деньги */
.monthnav{display:flex;align-items:center;justify-content:space-between}
.monthnav button{width:42px;height:42px;border-radius:14px;background:rgba(255,255,255,.08);color:var(--nightInk);display:grid;place-items:center}
.monthnav b{font-size:17px;font-weight:600}
.bigsum{font-family:var(--disp);font-size:44px;font-weight:600;letter-spacing:-.035em;color:var(--sun);margin:18px 0 2px;line-height:1.05}
.bigsum+.l{color:var(--nightMute);font-size:14px}
.split{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:16px}
.split div{background:rgba(255,255,255,.07);border-radius:16px;padding:11px 13px}
.split span{display:block;font-size:12.5px;color:var(--nightMute)}
.split b{font-size:17px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stat{background:var(--surface);border-radius:18px;padding:13px 8px;text-align:center;box-shadow:var(--shadow)}
.stat b{font-family:var(--disp);font-size:21px;font-weight:600;display:block}
.stat span{font-size:12px;color:var(--mute);font-weight:500}
.stat.go b{color:var(--go)}.stat.stop b{color:var(--stop)}.stat.off b{color:var(--off)}
.cmp{margin-top:12px;font-weight:600;border-radius:14px;padding:12px 14px;font-size:15px;display:flex;align-items:center;gap:8px}
.cmp.ok{background:var(--go-l);color:var(--go)}
.cmp.bad{background:var(--stop-l);color:var(--stop)}
.cmp.more{background:var(--plan-l);color:var(--plan)}

/* шторка */
#sheet{position:fixed;inset:0;z-index:20;display:flex;align-items:flex-end;justify-content:center}
#sheet.hidden{display:none}
#sheet .bd{position:absolute;inset:0;background:rgba(16,12,22,.5);backdrop-filter:blur(2px);-webkit-backdrop-filter:blur(2px)}
#sheet .panel{position:relative;background:var(--bg);width:100%;max-width:640px;max-height:92vh;overflow:auto;border-radius:28px 28px 0 0;padding:10px 18px calc(22px + env(safe-area-inset-bottom));animation:up .24s cubic-bezier(.2,.8,.2,1)}
@media(min-width:700px){#sheet{align-items:center}#sheet .panel{border-radius:28px;max-height:88vh}}
@keyframes up{from{transform:translateY(48px);opacity:.3}to{transform:none;opacity:1}}
@media (prefers-reduced-motion:reduce){#sheet .panel{animation:none}.sb{transition:none}}
.grab{width:40px;height:5px;border-radius:3px;background:var(--line);margin:2px auto 14px}
.sheettop{display:flex;justify-content:space-between;align-items:center;margin-bottom:4px;gap:10px}
.close{width:38px;height:38px;border-radius:12px;background:var(--surface);color:var(--mute);display:grid;place-items:center;flex:none}
.lbl{display:block;font-size:14px;font-weight:600;color:var(--ink2);margin:20px 2px 8px}
.seg{display:flex;gap:8px}
.seg button{flex:1;padding:14px 8px;border-radius:16px;background:var(--surface);font-weight:600;border:2px solid transparent;box-shadow:var(--shadow)}
.seg button.on{border-color:var(--violet);background:var(--violet-l);color:var(--violet)}
.chips{display:flex;flex-wrap:wrap;gap:7px}
.tgrid{display:grid;grid-template-columns:repeat(5,1fr);gap:7px}
.chip{padding:10px 13px;border-radius:12px;background:var(--surface);font-weight:600;font-size:15px;border:2px solid transparent;box-shadow:var(--shadow)}
.tgrid .chip{padding:11px 0}
.chip.on{border-color:var(--violet);background:var(--violet-l);color:var(--violet)}
.clist{display:flex;flex-direction:column;gap:7px;max-height:300px;overflow:auto;margin-top:8px}
.cpick{display:flex;align-items:center;justify-content:space-between;padding:12px 14px;border-radius:16px;background:var(--surface);border:2px solid transparent;font-weight:600;text-align:left;box-shadow:var(--shadow)}
.cpick.on{border-color:var(--violet);background:var(--violet-l)}
.cpick .chk{width:24px;height:24px;border-radius:8px;border:2px solid var(--line);display:grid;place-items:center;color:#fff;flex:none;margin-left:10px}
.cpick.on .chk{background:var(--violet);border-color:var(--violet)}
.calc{background:var(--surface);border-radius:18px;padding:14px 16px;margin-top:14px;display:flex;gap:10px;box-shadow:var(--shadow)}
.calc div{flex:1}
.calc span{display:block;font-size:12.5px;color:var(--mute);font-weight:500}
.calc b{font-family:var(--disp);font-size:18px;font-weight:600}
.foot{margin-top:22px;display:grid;gap:10px}
.note{font-size:13px;color:var(--mute);margin-top:8px}
.vmeta{color:var(--mute);margin:2px 0 12px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}

#toast{position:fixed;left:50%;top:calc(14px + env(safe-area-inset-top));transform:translate(-50%,-20px);background:var(--night);color:#fff;padding:13px 18px;border-radius:16px;font-weight:600;font-size:15px;opacity:0;pointer-events:none;transition:.25s;z-index:30;max-width:90vw;text-align:center;box-shadow:0 10px 30px rgba(0,0,0,.2)}
#toast.on{opacity:1;transform:translate(-50%,0)}
#toast.upper{bottom:auto!important;top:calc(14px + env(safe-area-inset-top))}
.loading{text-align:center;padding:80px 20px;color:var(--mute)}
.spin{width:34px;height:34px;border:3px solid var(--line);border-top-color:var(--violet);border-radius:50%;margin:0 auto 14px;animation:sp .8s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
.offline{background:var(--sun-l);color:var(--sun-d);font-weight:600;font-size:13px;text-align:center;border-radius:12px;padding:8px;margin:10px 0 0}

/* вход */
.auth{max-width:420px;margin:0 auto;padding-top:9vh;text-align:center}
.auth img{width:80px;height:80px;border-radius:24px;margin:0 auto 18px;display:block}
.auth h1{font-size:30px;margin-bottom:8px}
.auth form{display:grid;gap:10px;margin-top:26px;text-align:left}
.auth .err{color:var(--stop);font-weight:600;font-size:14px;min-height:18px}
.textb{color:var(--violet);font-weight:600;padding:10px;font-size:15px}

let IDX=null;
function buildIndex(){
  const vlist=[],byClient={},usedByPkg={},pkgsByClient={},lastByClient={};
  const t=today();
  for(const id in S.visits){const v=Object.assign({id},S.visits[id]);vlist.push(v);
    (byClient[v.clientId]=byClient[v.clientId]||[]).push(v);
    if(CH.includes(v.status)){
      if(v.packageId)usedByPkg[v.packageId]=(usedByPkg[v.packageId]||0)+1;
      if(v.date<=t&&(!lastByClient[v.clientId]||v.date>lastByClient[v.clientId]))lastByClient[v.clientId]=v.date;
    }}
  for(const id in S.packages){const p=S.packages[id];(pkgsByClient[p.clientId]=pkgsByClient[p.clientId]||[]).push(id)}
  for(const c in byClient)byClient[c].sort((a,b)=>(b.date+b.time).localeCompare(a.date+a.time));
  IDX={vlist,byClient,usedByPkg,pkgsByClient,lastByClient};
}
const visits=()=>IDX.vlist;
function pkgInfo(pid){const p=S.packages[pid];if(!p)return null;
  const count=Number(p.count)||0,prev=Number(p.prevUsed)||0,used=prev+(IDX.usedByPkg[pid]||0),rem=count-used,price=Number(p.price)||0,per=count?price/count:0;
  const expired=!!p.until&&p.until<today();
  return Object.assign({},p,{id:pid,count,prev,used,rem,price,per,expired,active:rem>0&&!expired})}
function clientPkgs(cid){return (IDX.pkgsByClient[cid]||[]).map(pkgInfo).sort((a,b)=>(a.buyDate||"").localeCompare(b.buyDate||"")||(a.createdAt||0)-(b.createdAt||0))}
// абонемент, с которого можно списать конкретное занятие: тот же формат, есть остаток, не истёк на дату занятия
function pkgFor(cid,format,date){return clientPkgs(cid).find(p=>p.format===format&&p.rem>0&&(!p.until||p.until>=date))||null}
function remainingFmt(cid,format){return clientPkgs(cid).filter(p=>p.active&&(!format||p.format===format)).reduce((s,p)=>s+p.rem,0)}
const remaining=cid=>remainingFmt(cid,null);
const hasAnyPkg=cid=>!!(IDX.pkgsByClient[cid]||[]).length;
const hasPkgFmt=(cid,f)=>clientPkgs(cid).some(p=>p.format===f);
// заработок по занятию: фиксируется в момент отметки (поле rate), чтобы прошлые месяцы не «плыли»
function earn(v){if(!CH.includes(v.status))return 0;if(typeof v.rate==="number")return v.rate;
  const p=v.packageId&&S.packages[v.packageId];if(!p||!Number(p.count))return 0;return Number(p.price)*shareOf(p)/Number(p.count)}
// целые рубли без потерь: k-е занятие абонемента получает floor(H*k/N)-floor(H*(k-1)/N), сумма = floor(H)
function rateFor(p,k){const H=Math.floor((Number(p.price)||0)*shareOf(p)),N=Number(p.count)||1;k=Math.min(Math.max(k,1),N);return Math.floor(H*k/N)-Math.floor(H*(k-1)/N)}

function badgeFor(cid,format){

  if(!hasAnyPkg(cid))return `<span class="badge none">нет абонемента</span>`;

}

  return r>0?`Здравствуйте, ${n}! В вашем абонементе осталось ${plural(r,"занятие","занятия","занятий")}. Будем продлевать?`:`Здравствуйте, ${n}! Ваш абонемент закончился. Будем продлевать?`}
function attention(){
  const out=[];const t=today();
  for(const cid of activeClients()){
    const c=S.clients[cid],name=c.name;
    const bd=bdayIn(c.birthday);
    if(bd!==null&&bd<=3)out.push([cid,name,bd===0?"🎂 день рождения сегодня":bd===1?"🎂 день рождения завтра":"🎂 день рождения через "+plural(bd,"день","дня","дней")]);
    if(c.remindedAt&&daysBetween(c.remindedAt,t)<3)continue;
    const pk=clientPkgs(cid);
    if(pk.length){
      const r=remaining(cid);
      const burnt=pk.filter(p=>p.expired&&p.rem>0).reduce((s,p)=>s+p.rem,0);
      if(r<=0){out.push([cid,name,burnt?"абонемент сгорел, не использовано "+burnt:"абонемент закончился"]);continue}
      if(r<=2){out.push([cid,name,"осталось "+plural(r,"занятие","занятия","занятий")]);continue}
      const soon=pk.find(p=>p.active&&p.until&&daysBetween(t,p.until)<=3);
      if(soon){out.push([cid,name,"сгорает "+short(soon.until)+", осталось "+soon.rem]);continue}
    }
    const lv=IDX.lastByClient[cid];
    if(lv&&daysBetween(lv,t)>14){
      const future=(IDX.byClient[cid]||[]).some(v=>v.date>=t&&v.status==="booked");
      if(!future)out.push([cid,name,"давно не приходит, "+plural(daysBetween(lv,t),"день","дня","дней")]);
    }
  }
  return out;
}
function bdayIn(b){if(!b)return null;const t=today();const y=Number(t.slice(0,4));const [ ,mm,dd]=b.split("-");let n=y+"-"+mm+"-"+dd;if(mm==="02"&&dd==="29"&&!(y%4===0&&(y%100!==0||y%400===0)))n=y+"-03-01";let d=daysBetween(t,n);if(d<0){n=(y+1)+n.slice(4);d=daysBetween(t,n)}return d}

function firstVisit(cid){const vs=IDX.byClient[cid]||[];let f="";for(const v of vs)if(CH.includes(v.status)&&(!f||v.date<f))f=v.date;return f}
function segment(cid){
  const c=S.clients[cid];if(c.active===false)return"arch";

}

function nRow(v){

function contactLinks(c){
  const out=[];const digits=String(c.phone||"").replace(/\D/g,"");
  let wa=digits;if(wa.length===11&&wa[0]==="8")wa="7"+wa.slice(1);if(wa.length===10)wa="7"+wa;
  if(digits)out.push({k:"tel",href:"tel:+"+wa,label:"Позвонить",icon:"phone"},{k:"wa",href:"https://wa.me/"+wa,label:"WhatsApp",icon:"msg"});
  const ct=String(c.contact||"").trim();
  const tg=ct.match(/(?:t\.me\/|telegram\.me\/)([A-Za-z0-9_]{4,})/)||(/^@[A-Za-z0-9_]{4,}$/.test(ct)&&!/insta/i.test(ct)?[0,ct.slice(1)]:null);
  if(tg)out.push({k:"tg",href:"https://t.me/"+tg[1],label:"Telegram",icon:"send"});
  const ig=ct.match(/instagram\.com\/([A-Za-z0-9_.]+)/i);
  if(ig)out.push({k:"ig",href:"https://instagram.com/"+ig[1],label:"Instagram",icon:"msg"});
  return out;
}

function analyticsBlock(sel){
  const months=[];for(let i=5;i>=0;i--)months.push(shiftMonth(sel,-i));
  const st={};for(const m of months)st[m]={e:0,came:0,cl:new Set()};
  for(const v of visits()){const o=st[v.date.slice(0,7)];if(!o)continue;o.e+=earn(v);if(CH.includes(v.status)){o.came++;o.cl.add(v.clientId)}}
  const mx=Math.max(1,...months.map(m=>st[m].e));

  const done=sel<today().slice(0,7);
  const dl=(a,b)=>b&&done?`<em class="${a>=b?"up":"dn"}">${a>=b?"+":""}${Math.round((a-b)/b*100)}%</em>`:"";
  const byCl={};for(const v of monthVisits(sel)){const e=earn(v);if(e)byCl[v.clientId]=(byCl[v.clientId]||0)+e}
  const topCl=Object.keys(byCl).sort((a,b)=>byCl[b]-byCl[a]).slice(0,5);
  // продления за 3 месяца
  const t=today();
  const ended=Object.keys(S.packages).map(pkgInfo).filter(p=>p.count>1&&(p.rem<=0||p.expired)&&daysBetween(p.buyDate||t,t)<=120);
  const renewed=ended.filter(p=>clientPkgs(p.clientId).some(q=>q.id!==p.id&&(q.createdAt||0)>(p.createdAt||0)));
  return `<h3>Динамика</h3><div class="card">
   <div class="chart2">${months.map(m=>`<button class="cb ${m===sel?"cur":""}" data-act="goMonth" data-v="${m}" aria-label="${monthName(m)}: ${money(st[m].e)}"><span class="cv">${st[m].e?(st[m].e>=1000?Math.round(st[m].e/1000)+"к":Math.round(st[m].e)):""}</span><i style="height:${Math.round(st[m].e/mx*90)+3}px"></i><span>${MONN[Number(m.slice(5))-1].slice(0,3)}</span></button>`).join("")}</div>
   <div class="kpis">
    <div class="kpi"><span>Заработок</span><b>${money(cur.e)}</b>${dl(cur.e,prev.e)}</div>
    <div class="kpi"><span>Клиентов ходило</span><b>${cur.cl.size}</b>${dl(cur.cl.size,prev.cl.size)}</div>
    <div class="kpi"><span>Продлевают абонемент</span><b>${ended.length?Math.round(renewed.length/ended.length*100)+"%":"—"}</b></div>
    <div class="kpi"><span>В среднем с занятия</span><b>${cur.came?money(cur.e/cur.came):"—"}</b></div></div></div>
  ${topCl.length?`<h3>Кто больше принёс</h3><div class="card">${topCl.map(cid=>`<button class="barrow" data-act="openClient" data-id="${cid}"><span class="bl">${esc(clientName(cid))}</span><span class="bt"><i style="width:${Math.max(6,Math.round(byCl[cid]/byCl[topCl[0]]*100))}%"></i></span><b>${money(byCl[cid])}</b></button>`).join("")}</div>`:""}`;
}

function csvCell(v){v=String(v==null?"":v);if(/^[=+\-@]/.test(v))v="'"+v;return /[";\n\r]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v}
function download(name,rows){
  const csv="﻿"+rows.map(r=>r.map(csvCell).join(";")).join("\r\n");
  const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([csv],{type:"text/csv;charset=utf-8"}));a.download=name;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},1500);
}
function visitRows(list){

async function saveBooking(){
  syncB();
  if(bookHint()){toast(bookHint());return}
  const ids=[...B.sel];let made=0,skipped=0;
  if(!B.force){const clash=ids.map(cid=>(IDX.byClient[cid]||[]).find(v=>v.date===B.date&&v.time!==B.time&&v.status!=="cancel")).filter(Boolean);
    if(clash.length){const msg=clash.map(v=>`${esc(clientName(v.clientId))} уже записан(а) на ${esc(v.time)}`).join("<br>");
      const keep=Object.assign({},B,{sel:new Set(B.sel)});confirmSheet("Уже есть запись в этот день",msg+"<br>Всё равно записать ещё и на "+B.time+"?","Да, записать",()=>{B=keep;B.force=true;closeSheet();saveBooking()});return}}
  const exists=(cid,date)=>(IDX.byClient[cid]||[]).some(v=>v.date===date&&v.time===B.time&&v.status!=="cancel");
  try{
    for(const cid of ids){
      if(exists(cid,B.date)){skipped++;continue}
      await db.collection("visits").add({clientId:cid,date:B.date,time:B.time,format:B.format,status:"booked",packageId:null,createdAt:Date.now()});made++;
    }
    closeSheet();S.view="day";S.day=B.date;render();

}

// убрать будущие неотмеченные записи группы (для тех, кто вышел, или при смене дней/времени)
async function dropFutureGroupVisits(gid,onlyClients){
  const t=today();
  for(const v of visits())if(v.groupId===gid&&v.status==="booked"&&v.date>=t&&(!onlyClients||onlyClients.includes(v.clientId)))await db.doc("visits/"+v.id).delete();
}
async function saveGroup(){
  syncG();if(gHint()){toast(gHint());return}
  const data={name:G.name.trim(),days:G.days.slice().sort(),time:G.time,members:[...G.members]};
  try{
    let id=G.id;
    if(id){const old=S.groups[id];
      const schedChanged=old.time!==data.time||String(old.days.slice().sort())!==String(data.days);
      const removed=(old.members||[]).filter(c=>!G.members.has(c));
      if(schedChanged)await dropFutureGroupVisits(id);else if(removed.length)await dropFutureGroupVisits(id,removed);
      await db.doc("groups/"+id).update(data);
    }else{data.createdAt=Date.now();data.from=today();data.skip=[];const r=await db.collection("groups").add(data);id=r.id}
    closeSheet();S.view="clients";S.cview="groups";render();
    setTimeout(()=>ensureGroupVisits(true),400);
  }catch(e){fail(e)}
}
let ensuring=false;
async function ensureGroupVisits(announce){
  if(ensuring||!db||!IDX)return;ensuring=true;
  try{
    const t=today();let made=0;
    const have=new Set(visits().map(v=>v.clientId+"|"+v.date+"|"+v.time));
    for(const gid in S.groups){const g=S.groups[gid];if(g.deleted||!g.days||!g.time)continue;
      for(let i=0;i<14;i++){const d=addDays(t,i);if(!g.days.includes(parse(d).getDay()))continue;if(g.from&&d<g.from)continue;if((g.skip||[]).includes(d))continue;
        for(const cid of g.members||[]){const c=S.clients[cid];if(!c||c.active===false)continue;const k=cid+"|"+d+"|"+g.time;if(have.has(k))continue;have.add(k);
          await db.collection("visits").add({clientId:cid,date:d,time:g.time,format:GRP,status:"booked",packageId:null,groupId:gid,createdAt:Date.now()});made++}}}
    if(announce&&made)toast("Записала группу: "+plural(made,"запись","записи","записей")+" на 2 недели");
  }finally{ensuring=false}
}

  if(price===null||isNaN(price)||price<=0){toast("Укажи цену, например 25000");return null}

function statusPatch(v,s){
  const keepManual=v.pkgManual&&v.packageId&&S.packages[v.packageId];
  if(CH.includes(s)){
    if(CH.includes(v.status)&&v.packageId&&S.packages[v.packageId])return{status:s,packageId:v.packageId,rate:typeof v.rate==="number"?v.rate:rateFor(pkgInfo(v.packageId),pkgInfo(v.packageId).used)};
    let p=null;
    if(keepManual){const pi=pkgInfo(v.packageId);if(pi.rem>0)p=pi}
    if(!p)p=pkgFor(v.clientId,v.format,v.date);
    return{status:s,packageId:p?p.id:null,rate:p?rateFor(p,p.used+1):null,pkgManual:!!(p&&keepManual&&p.id===v.packageId)};
  }
  return{status:s,packageId:keepManual?v.packageId:null,rate:null};
}
async function setStatus(id,s,silent){
  const v=S.visits[id];if(!v)return null;
  const prev={status:v.status,packageId:v.packageId||null,rate:typeof v.rate==="number"?v.rate:null,pkgManual:!!v.pkgManual};
  const patch=statusPatch(v,s);patch.statusAt=new Date().toISOString();
  try{await db.doc("visits/"+id).update(patch)}catch(e){fail(e);return null}
  if(!silent){
    const undo=()=>db.doc("visits/"+id).update(prev);
    const nm=firstName(clientName(v.clientId));
    if(CH.includes(s))toast(patch.rate!=null?`${nm}: ${STL[s].toLowerCase()}, +${money(patch.rate)} тебе`:`${nm}: отмечено, но нет абонемента`,undo);
    else if(s==="cancel")toast(`${nm}: отменил, не списано`,undo);
    else if(s==="booked")toast(`${nm}: отметка снята`,undo);
  }
  return prev;
}
async function allCame(date,time){
  const list=visits().filter(v=>v.date===date&&v.time===time&&v.format===GRP&&v.status==="booked");
  const prevs=[];let sum=0;
  for(const v of list){const prev=await setStatus(v.id,"came",true);if(prev){prevs.push([v.id,prev]);sum+=earn(Object.assign({},S.visits[v.id]))}}
  toast(`Отмечено ${list.length}: +${money(sum)} тебе`,()=>Promise.all(prevs.map(([id,p])=>db.doc("visits/"+id).update(p))));
}

let auth=null,fs=null,unsubs=[];
function makeDb(uid){
  const base="users/"+uid+"/";
  const bg=p=>{p.catch(fail);return Promise.resolve()}; // запись уходит в фоне: работает и без интернета
  const ref=path=>{const r=doc(fs,base+path);return{id:r.id,set:d=>bg(setDoc(r,d)),update:d=>bg(updateDoc(r,d)),delete:()=>bg(deleteDoc(r))}};
  return{
    doc:ref,
    collection:c=>({
      add:d=>{const r=doc(collection(fs,base+c));bg(setDoc(r,d));return Promise.resolve({id:r.id})},
      onSnapshot:(next,err)=>onSnapshot(collection(fs,base+c),snap=>next({docs:snap.docs.map(x=>({id:x.id,data:()=>x.data()}))}),err)
    })
  };
}
let migrated=false;
function migrateRates(){ // старые отметки без зафиксированного заработка
  if(migrated)return;migrated=true;
  const byPkg={};
  for(const v of visits())if(CH.includes(v.status)&&typeof v.rate!=="number"&&v.packageId&&S.packages[v.packageId])(byPkg[v.packageId]=byPkg[v.packageId]||[]).push(v);
  for(const pid in byPkg){
    const all=visits().filter(v=>v.packageId===pid&&CH.includes(v.status)).sort((a,b)=>(a.date+a.time).localeCompare(b.date+b.time));
    const p=S.packages[pid];let k=Number(p.prevUsed)||0;
    for(const v of all){k++;if(typeof v.rate!=="number")db.doc("visits/"+v.id).update({rate:rateFor(p,k)})}
  }
}
function startData(uid){
  unsubs.forEach(u=>u());unsubs=[];
  S.clients={};S.packages={};S.visits={};S.payouts={};S.groups={};S.settings={};S.ready=false;S.slow=false;IDX=null;migrated=false;
  db=makeDb(uid);render();
  const timer=setTimeout(()=>{if(!S.ready){S.slow=true;render()}},10000);
  const cols=["clients","packages","visits","payouts","groups","settings"];const got=new Set();
  let raf=0;const schedule=()=>{if(raf)return;raf=requestAnimationFrame(()=>{raf=0;buildIndex();render()})};
  for(const c of cols){
    unsubs.push(db.collection(c).onSnapshot(snap=>{
      const m={};snap.docs.forEach(d=>{m[d.id]=d.data()});
      S[c]=m;
      got.add(c);if(got.size===cols.length&&!S.ready){S.ready=true;clearTimeout(timer);buildIndex();migrateRates();setTimeout(ensureGroupVisits,300)}
      if(S.ready)schedule();
    },err=>{console.error(c,err);got.add(c);if(got.size===cols.length&&!S.ready){S.ready=true;clearTimeout(timer)}schedule();toast("Ошибка доступа к данным")}));
  }
}
async function init(){
  if(!firebaseConfig||!firebaseConfig.apiKey||String(firebaseConfig.apiKey).startsWith("ВСТАВЬ")){S.nodb=true;render();return}
  const app=initializeApp(firebaseConfig);
  fs=initializeFirestore(app,{localCache:persistentLocalCache({tabManager:persistentMultipleTabManager()})});
  auth=getAuth(app);
  try{await setPersistence(auth,browserLocalPersistence)}catch(_){}
  S.user=undefined;render();
  onAuthStateChanged(auth,u=>{
    if(u){S.user=u;startData(u.uid)}
    else{unsubs.forEach(x=>x());unsubs=[];db=null;S.user=null;S.ready=false;render()}
  });
  addEventListener("online",()=>{S.online=true;render()});
  addEventListener("offline",()=>{S.online=false;render()});
  if("serviceWorker" in navigator){
    navigator.serviceWorker.register("sw.js").catch(()=>{});
    let had=!!navigator.serviceWorker.controller;
    navigator.serviceWorker.addEventListener("controllerchange",()=>{if(had){toast("Приложение обновлено");setTimeout(()=>location.reload(),1200)}had=true});
  }
}
init();
</script>
